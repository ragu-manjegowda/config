name: AwesomeWM Interactive GUI Tests

on:
  push:
    paths:
      - ".config/awesome/**"
      - ".github/workflows/awesome-gui-tests.yml"
  pull_request:
    paths:
      - ".config/awesome/**"
      - ".github/workflows/awesome-gui-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build Arch GUI image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build Arch GUI environment
        run: docker build -f .config/awesome/tests/gui.Dockerfile -t awesome-gui .config/awesome/tests
      - name: Export GUI image
        run: docker save awesome-gui | gzip -1 > "$RUNNER_TEMP/awesome-gui-image.tar.gz"
      - name: Share GUI image with test jobs
        uses: actions/upload-artifact@v6
        with:
          name: awesome-gui-image
          path: ${{ runner.temp }}/awesome-gui-image.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  gui:
    name: ${{ matrix.suite }} (${{ matrix.display.name }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [centers, lifecycle]
        display:
          - id: imac-1080p-96dpi
            name: iMac 1080p / 96 DPI
            profile: config_imac.lua
            screen: 1920x1080@96
          - id: lenovo-1200p-96dpi
            name: Lenovo 1200p / 96 DPI
            profile: config_lenovo.lua
            screen: 1920x1200@96
          - id: laptop-1800p-144dpi
            name: Laptop 1800p / 144 DPI
            profile: config.lua
            screen: 2880x1800@144
          - id: laptop-ultrawide-144dpi
            name: Laptop ultrawide / 144 DPI
            profile: config.lua
            screen: 3440x1440@144
    env:
      GUI_SUITE: ${{ matrix.suite }}
      GUI_PROFILE: ${{ matrix.display.profile }}
      GUI_SCREEN: ${{ matrix.display.screen }}
      GUI_EVIDENCE: awesome-gui-${{ matrix.suite }}-${{ matrix.display.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive
      - name: Download GUI image
        uses: actions/download-artifact@v7
        with:
          name: awesome-gui-image
          path: ${{ runner.temp }}/gui-image
      - name: Load GUI image
        run: gzip -dc "$RUNNER_TEMP/gui-image/awesome-gui-image.tar.gz" | docker load
      - name: Run isolated GUI tests without network access
        id: tests
        run: |
          artifacts="$RUNNER_TEMP/awesome-gui"
          mkdir -p "$artifacts"
          docker run --rm --network none \
            -e GUI_PROFILE -e GUI_SCREEN \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$artifacts:/artifacts" awesome-gui \
            python3 -B ".config/awesome/tests/gui_${GUI_SUITE}.py" \
            2>&1 | tee "$artifacts/runner.log"
      - name: Record GUI result
        if: always()
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
        run: |
          {
            echo "### Awesome GUI: $GUI_SUITE"
            echo "- Profile: $GUI_PROFILE"
            echo "- Display: $GUI_SCREEN"
            echo "- Test result: $TEST_RESULT"
            echo "- Evidence artifact: $GUI_EVIDENCE"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$TEST_RESULT" != success ]; then
            log="$RUNNER_TEMP/awesome-gui/runner.log"
            printf '::error title=Awesome GUI %s (%s)::Test result: %s; see the job summary for failure output.\n' "$GUI_SUITE" "$GUI_PROFILE" "$TEST_RESULT"
            if [ -f "$log" ]; then
              while IFS= read -r failure; do
                failure="${failure//%/%25}"
                printf '::error title=Awesome GUI %s (%s)::%s\n' "$GUI_SUITE" "$GUI_PROFILE" "$failure"
              done < <(grep -E '^(FAIL|ERROR): ' "$log" || true)
              {
                echo '### Failure output'
                echo '```text'
                cat "$log"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'Tests did not produce a runner log; inspect the failed setup/image step.' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - name: Upload GUI evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.GUI_EVIDENCE }}
          path: ${{ runner.temp }}/awesome-gui
          if-no-files-found: warn
          retention-days: 7

  summary:
    name: Awesome GUI summary
    needs: [build, gui]
    if: always()
    runs-on: ubuntu-latest
    env:
      BUILD_RESULT: ${{ needs.build.result }}
      GUI_RESULT: ${{ needs.gui.result }}
    steps:
      - name: Require all GUI jobs to pass
        run: |
          {
            echo '## Awesome GUI checks'
            echo '| Stage | Result |'
            echo '| --- | --- |'
            echo "| Image build | $BUILD_RESULT |"
            echo "| Centers and lifecycle across four displays | $GUI_RESULT |"
            echo 'Each matrix job has its own logs, result summary, and evidence artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$BUILD_RESULT" = success
          test "$GUI_RESULT" = success
