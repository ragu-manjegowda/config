#!/usr/bin/nft -f
# vim:set ts=2 sw=2 et:

# Workstation firewall ruleset
# - Default-deny inbound, permissive outbound
# - SSH and on-demand VNC restricted to local subnet (192.168.1.0/24)
#   or the enrolled Tailscale phone on tailscale0
# - VPN (tun) traffic allowed except non-LAN management connections
# - mDNS/LLMNR for local service discovery
#
# Applied: 2026-02-15

destroy table inet filter
table inet filter {

  # Exact Tailscale device addresses, not the whole tailnet/CGNAT subnet.
  # Empty sets fail closed until a phone has been enrolled.
  set tailscale_phone4 {
    type ipv4_addr
    elements = { 100.105.120.44 }
  }

  set tailscale_phone6 {
    type ipv6_addr
    elements = { fd7a:115c:a1e0::9001:78e2 }
  }

  chain tailscale_remote {
    ct state invalid drop
    ip saddr @tailscale_phone4 tcp dport { 22, 5900 } counter accept comment "allow phone SSH and VNC"
    ip6 saddr @tailscale_phone6 tcp dport { 22, 5900 } counter accept comment "allow phone SSH and VNC IPv6"
    ct state { established, related } accept comment "allow replies to laptop-initiated tailnet connections"
    counter drop comment "deny other inbound Tailscale access"
  }

  chain input {
    type filter hook input priority filter
    policy drop

    # --- Connection tracking ---
    ct state invalid drop comment "drop invalid packets"
    iifname "tailscale0" jump tailscale_remote comment "restrict Tailscale before LAN and established rules"
    ct state { established, related } accept comment "allow tracked connections"

    # --- Loopback ---
    iif lo accept comment "allow all loopback traffic"

    # Waydroid's private bridge needs the host DHCP/DNS services only.
    iifname "waydroid0" udp dport { 53, 67 } accept comment "Waydroid DHCP and DNS"
    iifname "waydroid0" tcp dport 53 accept comment "Waydroid DNS TCP"

    # --- Desktop management (IPv4 LAN only, including on VPN interfaces) ---
    ip saddr 192.168.1.0/24 tcp dport 22 accept comment "allow SSH from local subnet"
    ip saddr 192.168.1.0/24 tcp dport 5900 accept comment "allow VNC from local subnet"
    tcp dport { 22, 5900 } drop comment "deny non-LAN SSH and VNC"

    # --- VPN tunnel interfaces ---
    iifname "tun*" accept comment "allow all traffic on VPN tun interfaces"

    # --- ICMP / ICMPv6 (essential for network health) ---
    ip protocol icmp accept comment "allow ICMPv4"
    meta l4proto ipv6-icmp accept comment "allow ICMPv6"

    # --- mDNS (local link multicast, UDP 5353) ---
    udp dport 5353 accept comment "allow mDNS for local service discovery"

    # --- LLMNR (link-local name resolution, UDP/TCP 5355) ---
    udp dport 5355 accept comment "allow LLMNR UDP"
    tcp dport 5355 accept comment "allow LLMNR TCP"

    # --- Rate-limited reject for everything else (gives feedback to legit clients) ---
    pkttype host limit rate 5/second counter reject with icmpx type admin-prohibited
    counter comment "count dropped packets"
  }

  chain forward {
    type filter hook forward priority filter
    policy drop
    iifname "waydroid0" accept comment "Waydroid outbound networking"
    oifname "waydroid0" ct state { established, related } accept comment "Waydroid reply traffic"
  }
}
