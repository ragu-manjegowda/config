[Service]
ExecStartPre=
ExecStartPre=/usr/bin/v4l2-ctl --device=/dev/video90 --set-fmt-video-out=width=1920,height=1080,pixelformat=YUYV
ExecStart=
ExecStart=/usr/bin/v4l2-relayd -i "libcamerasrc ae-enable=true awb-enable=true sharpness=1.5" -o "appsrc name=appsrc caps=video/x-raw,format=BGRA,width=1920,height=1080,framerate=30/1 ! videoconvert ! video/x-raw,format=I420,width=1920,height=1080,framerate=30/1 ! v4l2sink name=v4l2sink device=/dev/video90 sync=false"
