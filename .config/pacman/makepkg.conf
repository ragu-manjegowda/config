#!/hint/bash
# shellcheck disable=2034

MAKEFLAGS="-j$(nproc)"

# Arch builds must use system tools and libraries, including manual paru builds.
# This file is sourced inside makepkg; it does not change the invoking shell.
_makepkg_path=/usr/bin:/bin
IFS=: read -r -a _makepkg_previous_path <<< "$PATH"
for _makepkg_directory in "${_makepkg_previous_path[@]}"; do
    [[ -n "$_makepkg_directory" ]] || continue
    case ":$_makepkg_path:" in
        *":$_makepkg_directory:"*) ;;
        *) _makepkg_path="$_makepkg_path:$_makepkg_directory" ;;
    esac
done
export PATH="$_makepkg_path"
unset _makepkg_path _makepkg_previous_path _makepkg_directory
export PKG_CONFIG=/usr/bin/pkg-config
export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/share/pkgconfig
export PKG_CONFIG_LIBDIR=/usr/lib/pkgconfig:/usr/share/pkgconfig
