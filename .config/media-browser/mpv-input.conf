# These bindings apply only when mpv is opened through media-browser.
h add video-pan-x 0.05
j add video-pan-y -0.05
k add video-pan-y 0.05
l add video-pan-x -0.05
Ctrl+d seek 30
Ctrl+u seek -30
# Preserve z as a sequence prefix instead of adjusting subtitle delay.
z ignore
z-i add video-zoom 0.1
z-o add video-zoom -0.1
